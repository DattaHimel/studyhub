<!DOCTYPE html>
<!--
  StudyHub - a student productivity dashboard
  Built to practise every topic from CSIT884 Web Development.

  MODERN: <!DOCTYPE html> tells the browser to use modern HTML5 rules.
  The course pages often left it out; every professional page starts with it.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- MODERN: makes the page scale properly on phones (needed for a responsive layout) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub - Student Productivity Dashboard</title>

  <!-- External CSS file (course topic: the 3 ways to add CSS; external is best for a real project) -->
  <link rel="stylesheet" href="css/style.css" />

  <!--
    JavaScript files.
    MODERN: "defer" means: download the file now, but run it only after the
    whole page is built. That lets us keep scripts in the <head> (like the course
    rule) without the "element is null" problem, and with no need for onLoad.
  -->
  <!-- order matters: helper files first, because tasks.js uses their functions -->
  <script src="js/dragdrop.js" defer></script>
  <script src="js/validation.js" defer></script>
  <script src="js/chart.js" defer></script>
  <script src="js/tasks.js" defer></script>
  <script src="js/timer.js" defer></script>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="brand">
      <span class="logo">&#128218;</span>
      <h1>StudyHub</h1>
    </div>
    <p class="tagline">Plan your tasks, focus, and track your progress.</p>
  </header>

  <!-- ===== Main dashboard ===== -->
  <main class="dashboard">

    <!-- Left column: add-task form, focus timer, weather -->
    <aside class="sidebar">

      <!-- Add-task form (course topics: web forms + form validation) -->
      <section class="card" id="addTaskCard">
        <h2>Add a task</h2>
        <!--
          novalidate turns OFF the browser's built-in pop-up checks
          (course: required, maxlength ...) so we can show our own
          friendly red messages with JavaScript instead.
        -->
        <form id="taskForm" novalidate>
          <label for="taskTitle">Task</label>
          <input type="text" id="taskTitle" placeholder="e.g. Finish CSIT884 assignment" />
          <span class="error" id="titleError"></span>

          <label for="taskDue">Due date</label>
          <input type="date" id="taskDue" />
          <span class="error" id="dueError"></span>

          <label for="taskPriority">Priority</label>
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>

          <button type="submit" class="btn btn-primary">Add task</button>
        </form>
      </section>

      <!-- Focus timer (course topic: animation with setInterval) -->
      <section class="card" id="timerCard">
        <h2>Focus timer</h2>
        <p class="timer-display" id="timerDisplay">25:00</p>
        <div class="button-row">
          <button class="btn btn-primary" id="startTimer">Start</button>
          <button class="btn" id="stopTimer">Stop</button>
          <button class="btn" id="resetTimer">Reset</button>
        </div>
        <p class="timer-message" id="timerMessage"></p>
        <p class="session-count muted" id="sessionCount"></p>
      </section>

      <!-- Weather widget (course topic: AJAX + JSON) -->
      <section class="card" id="weatherCard">
        <h2>Weather</h2>
        <div id="weatherDisplay" class="muted">Weather will appear here.</div>
      </section>

    </aside>

    <!-- Right side: Kanban board and progress chart -->
    <div class="content">

      <!-- Kanban board (course topics: DOM + drag and drop) -->
      <section class="board" id="board">
        <div class="column" id="todo">
          <h2>To Do <span class="count" id="todoCount">0</span></h2>
          <div class="task-list" id="todoList"></div>
        </div>
        <div class="column" id="doing">
          <h2>Doing <span class="count" id="doingCount">0</span></h2>
          <div class="task-list" id="doingList"></div>
        </div>
        <div class="column" id="done">
          <h2>Done <span class="count" id="doneCount">0</span></h2>
          <div class="task-list" id="doneList"></div>
        </div>
      </section>

      <!-- Progress chart (course topic: canvas) -->
      <section class="card" id="chartCard">
        <h2>Progress</h2>
        <canvas id="progressChart" width="600" height="220">
          Your browser does not support canvas.
        </canvas>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    Built with HTML, CSS and JavaScript &middot; CSIT884 portfolio project
  </footer>

</body>
</html>
